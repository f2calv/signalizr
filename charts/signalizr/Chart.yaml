apiVersion: v2
name: signalizr
description: Umbrella chart deploying the signalizr gateway alongside the signal-cli REST wrapper it owns.
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  # The upstream signal-cli REST wrapper. Owns the registered account and its on-disk state.
  - name: signalcli
    version: 1.0.1
    repository: oci://ghcr.io/f2calv/charts

  # The gateway itself: Gateway and Receiver roles from one image.
  - name: workload
    version: 1.1.0
    repository: oci://ghcr.io/f2calv/charts
    alias: signalizr

  # One-shot EF Core migration job. Dormant by default.
  - name: workload
    version: 1.1.0
    repository: oci://ghcr.io/f2calv/charts
    alias: migrate

  # The same image running only the DemoClient role. Disabled by default.
  - name: workload
    version: 1.1.0
    repository: oci://ghcr.io/f2calv/charts
    alias: demo
