name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#Deny all permissions at workflow level; jobs grant only what they need.
permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: read
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    needs: [versioning]
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    with:
      version: ${{ needs.versioning.outputs.version }}
      solution-name: signalizr.Release.slnx
      dotnet-test-args: '["--filter-not-trait", "Category=Integration"]'

  package:
    runs-on: ubuntu-24.04
    needs: [versioning, build]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write #NuGet Trusted Publishing
      packages: write #GitHub Packages publication
    steps:
      - uses: f2calv/gha-dotnet-nuget@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          nuget-user: ${{ github.repository_owner }}
          configuration: Release
          version: ${{ needs.versioning.outputs.version }}
          solution-name: signalizr.Release.slnx
          dotnet-test-args: --filter-not-trait Category=Integration

  image:
    needs: [versioning, build]
    permissions:
      contents: read
      packages: write #push to ghcr.io
    uses: f2calv/gha-workflows/.github/workflows/container-image-build.yml@v1
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      tag: ${{ needs.versioning.outputs.version }}
      #A pull request proves the image builds on every architecture without publishing it.
      push-image: ${{ github.event_name != 'pull_request' }}
      #The container starts a long-lived host, so the smoke test asserts the startup validation
      #instead: an unknown feature name must fail fast rather than boot a misconfigured role.
      smoke-test: |
        ! docker run --rm -e CasCap__FeatureConfig__EnabledFeatures=NotAFeature $IMAGE

  dashboards:
    needs: [versioning]
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/helm-chart-package.yml@v1
    with:
      tag: ${{ needs.versioning.outputs.version }}
      image-registry: ghcr.io
      image-repository: ${{ github.repository_owner }}/signalizr
      chart-registry: ghcr.io
      chart-registry-username: ${{ github.repository_owner }}
      chart-repository: ${{ github.repository_owner }}/charts/signalizr-dashboards
      chart-path: ./charts/signalizr-dashboards
      has-image: false
      chart-testing-cli-command: skip
      #Dashboard releases use their own Chart.yaml version and deployment workflow.
      push-chart: false

  chart:
    needs: [versioning, image, dashboards]
    permissions:
      contents: read
      packages: write #push the OCI chart to ghcr.io
    uses: f2calv/gha-workflows/.github/workflows/helm-chart-package.yml@v1
    with:
      tag: ${{ needs.versioning.outputs.version }}
      image-registry: ghcr.io/${{ github.repository_owner }}
      image-repository: signalizr
      chart-registry: ghcr.io
      chart-registry-username: ${{ github.repository_owner }}
      chart-repository: ${{ github.repository_owner }}/charts/signalizr
      chart-path: ./charts/signalizr
      #The umbrella chart owns no top-level image value; each component carries its own, so
      #chart-testing must not inject --set image.tag.
      has-image: false
      #Skipped because the shared workflow mishandles both branches of its chart-testing arguments:
      #with has-image true helm lint receives '--set image.tag=x' as one argv, and with it false the
      #empty array expands to a stray argument that swallows the next flag. helm lint still runs.
      chart-testing-cli-command: skip
      #Chart publication is intentionally separate from the application/NuGet release. The chart
      #package currently has independent GHCR ownership; this job still validates and packages it.
      push-chart: false

  release:
    needs: [lint, versioning, build, package, image, dashboards, chart]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
