name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#Deny all permissions at workflow level; jobs grant only what they need.
permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: read
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    needs: [versioning]
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    with:
      version: ${{ needs.versioning.outputs.version }}
      solution-name: signalizr.Release.slnx
      dotnet-test-args: '["--filter-not-trait", "Category=Integration"]'

  #Lints each chart against every ci/ fixture with the repository's pinned Helm, independent of chart-testing.
  helm:
    name: helm (${{ matrix.chart }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart:
          - charts/signalizr
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: 3.20.2

      - name: helm dependency build ${{ matrix.chart }}
        run: helm dependency build "${{ matrix.chart }}"

      - name: helm lint ${{ matrix.chart }}
        run: helm lint "${{ matrix.chart }}"

      - name: helm lint ${{ matrix.chart }} with ci values
        shell: bash
        run: |
          shopt -s nullglob
          fixtures=("${{ matrix.chart }}"/ci/*-values.yaml)
          if [[ ${#fixtures[@]} -eq 0 ]]; then
            echo "::error::${{ matrix.chart }} has no ci/*-values.yaml fixtures."
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            helm lint "${{ matrix.chart }}" --values "$fixture"
          done

  package:
    runs-on: ubuntu-24.04
    needs: [versioning, build]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write #NuGet Trusted Publishing
      packages: write #GitHub Packages publication
    steps:
      - uses: f2calv/gha-dotnet-nuget@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          nuget-user: ${{ github.repository_owner }}
          configuration: Release
          version: ${{ needs.versioning.outputs.version }}
          solution-name: signalizr.Release.slnx
          #The build job has already run these tests on the same commit.
          execute-tests: false

  image:
    needs: [versioning, build]
    permissions:
      contents: read
      packages: write #push to ghcr.io
    uses: f2calv/gha-workflows/.github/workflows/container-image-build.yml@v1
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      tag: ${{ needs.versioning.outputs.version }}
      #A pull request proves the image builds on every architecture without publishing it.
      push-image: ${{ github.event_name != 'pull_request' }}
      #The container starts a long-lived host, so the smoke test asserts the startup validation
      #instead: an unknown feature name must fail fast rather than boot a misconfigured role.
      smoke-test: |
        ! docker run --rm -e CasCap__FeatureConfig__EnabledFeatures=NotAFeature $IMAGE

  chart:
    needs: [versioning, image]
    permissions:
      contents: read
      packages: write #push the OCI chart to ghcr.io
    uses: f2calv/gha-workflows/.github/workflows/helm-chart-package.yml@v1
    with:
      tag: ${{ needs.versioning.outputs.version }}
      image-registry: ghcr.io/${{ github.repository_owner }}
      image-repository: signalizr
      chart-registry: ghcr.io
      chart-registry-username: ${{ github.repository_owner }}
      chart-repository: ${{ github.repository_owner }}/charts/signalizr
      chart-path: ./charts/signalizr
      #The umbrella chart owns no top-level image value; each component carries its own, so
      #chart-testing must not inject --set image.tag.
      has-image: false
      push-chart: ${{ github.event_name != 'pull_request' }}

  release:
    needs: [lint, versioning, build, helm, package, image, chart]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      tag-prefix: ''
      move-major-tag: false
