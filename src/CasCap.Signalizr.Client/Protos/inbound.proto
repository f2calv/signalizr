syntax = "proto3";

option csharp_namespace = "CasCap.Grpc";

package signalizr.v1;

// Inbound Signal messages, fanned out to subscribers.
service Inbound {
  // Bidirectional, not server-streaming, so a subscriber acknowledges each message. A
  // fire-and-forget stream would let the server consider a message delivered the moment it was
  // written to the socket, which reproduces the upstream wrapper's silent-drop defect one layer
  // up: the very thing this service exists to fix.
  rpc Subscribe(stream SubscribeRequest) returns (stream InboundMessage);
}

message SubscribeRequest {
  oneof payload {
    // Sent once, before anything else, to select the durable subscriber cursor.
    Hello hello = 1;
    // Sent per delivered message.
    Ack ack = 2;
  }
}

message Hello {
  // Stable durable cursor key. Only one live stream may use a name at a time.
  string subscriber_name = 1;
}

message Ack {
  string delivery_id = 1;
}

message InboundMessage {
  // Durable Signalizr message sequence. Subscriber acknowledgements advance independent cursors.
  string delivery_id = 1;

  // The configured channel name, or empty when the message did not arrive on a known channel.
  string channel = 2;

  // The sender's Signal identifier. Personal data: never log it, never put it in a metric label
  // or a trace attribute.
  string sender = 3;

  string message = 4;

  // Milliseconds since the Unix epoch, as supplied by the Signal server.
  int64 timestamp = 5;

  // Durable descriptors only. Binary content is downloaded through the REST attachment surface.
  repeated InboundAttachment attachments = 6;

  // Whether the gateway's own account sent the message. On an account linked to a person's phone
  // the owner's own messages are marked too, so a consumer serving the owner must not drop them on
  // this flag alone.
  bool from_self = 7;

  // Set when the message is a vote on a poll rather than ordinary content.
  PollVote poll_vote = 8;
}

message PollVote {
  // The Signal timestamp of the poll message, which is also the poll identifier.
  int64 poll_timestamp = 1;

  // The selected answers by index. A voter's later vote replaces their earlier one.
  repeated int32 option_indexes = 2;
}

message InboundAttachment {
  string id = 1;
  string content_type = 2;
  string filename = 3;
  int64 size = 4;
}
